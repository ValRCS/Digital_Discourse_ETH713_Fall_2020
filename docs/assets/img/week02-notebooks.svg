<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">From notebook to research evidence</title><desc id="desc">A notebook connects to libraries, runtime and research data, producing a frequency chart.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#315063" stroke-width=".6"/></pattern></defs><rect width="640" height="360" rx="18" fill="#102432"/><rect width="640" height="360" rx="18" fill="url(#grid)"/><g font-family="system-ui,sans-serif"><rect x="22" y="50" width="235" height="260" rx="12" fill="#f0f4f5"/><path d="M34 50H245Q257 50 257 62V80H22V62Q22 50 34 50" fill="#c9dce1"/><circle cx="38" cy="65" r="4" fill="#cc765e"/><circle cx="51" cy="65" r="4" fill="#d9ab57"/><circle cx="64" cy="65" r="4" fill="#62a88b"/><text x="143" y="70" fill="#223b48" font-size="12" text-anchor="middle">research.ipynb</text><text x="38" y="109" fill="#193b50" font-size="15" font-weight="700">Research question</text><text x="38" y="129" fill="#536b76" font-size="12">How often is Rīga mentioned?</text><g font-family="monospace" font-size="12" fill="#23665e"><rect x="38" y="148" width="202" height="60" rx="5" fill="#dce8ed"/><text x="48" y="170">from collections</text><text x="48" y="188">    import Counter</text><rect x="38" y="218" width="202" height="46" rx="5" fill="#dce8ed"/><text x="48" y="237">Counter(words)</text><text x="48" y="253"># count tokens</text></g><text x="38" y="289" fill="#294d69" font-size="13">Output [3]: Rīga → 4</text><g stroke="#e9c985" stroke-width="2" fill="none"><path d="M266 180H294M287 173L294 180L287 187"/><path d="M430 93H447V180H468M430 180H468M430 267H447V180"/></g><g fill="#224654" stroke="#5d969e"><rect x="302" y="55" width="128" height="76" rx="8"/><rect x="302" y="142" width="128" height="76" rx="8"/><rect x="302" y="229" width="128" height="76" rx="8"/></g><g fill="#d5e9ed" text-anchor="middle"><text x="366" y="85" font-size="14" font-weight="700">Libraries</text><text x="366" y="105" font-size="11">Methods and tools</text><text x="366" y="172" font-size="14" font-weight="700">Runtime</text><text x="366" y="192" font-size="11">Execution and state</text><text x="366" y="259" font-size="14" font-weight="700">Research data</text><text x="366" y="279" font-size="11">Files and metadata</text></g><rect x="476" y="95" width="146" height="170" rx="10" fill="#1b3545" stroke="#86bcb6"/><text x="549" y="120" font-size="14" fill="#f1e1c7" text-anchor="middle" font-weight="700">Evidence</text><path d="M494 225H606M494 225V138" fill="none" stroke="#80a2ae"/><g fill="#75b9ac"><rect x="505" y="149" width="21" height="76" rx="2"/><rect x="535" y="187" width="21" height="38" rx="2"/><rect x="565" y="187" width="21" height="38" rx="2"/><rect x="595" y="206" width="9" height="19" rx="2"/></g><text x="549" y="249" fill="#cce5eb" font-size="11" text-anchor="middle">Reproducible results</text></g></svg>