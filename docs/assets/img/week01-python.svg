<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">From Words to Code</title><desc id="desc">Python code and a text document become tokens above Riga's skyline.</desc><rect width="640" height="360" rx="20" fill="#142638"/><circle cx="540" cy="85" r="110" fill="#25455a"/><g font-family="monospace" fill="#b8d4e5" font-size="14"><text x="26" y="33" letter-spacing="2">DIGITAL DISCOURSE · 01</text><text x="26" y="333" letter-spacing="1">LANGUAGE → DATA → UNDERSTANDING</text></g><rect x="26" y="63" width="282" height="216" rx="12" fill="#1f3549" stroke="#64889e"/><g font-family="monospace" font-size="14" fill="#e5eff5"><text x="42" y="92" fill="#8fc8bc">● ● ●</text><text x="42" y="125" fill="#94b4cd"># Our first text</text><text x="42" y="151">text = <tspan fill="#f7ce79">"Rīga lasa."</tspan></text><text x="42" y="177">words = text.split()</text><text x="42" y="203">print(len(words))</text><path d="M42 220H290" stroke="#69869a"/><text x="42" y="249" fill="#8fc8bc">2</text></g><path d="M315 158h35m-8-7 8 7-8 7" fill="none" stroke="#f7ce79" stroke-width="3"/><path d="M362 68h105l28 28v108H362z" fill="#ebe5d5"/><path d="M467 68v28h28" fill="#b8b9ad"/><text x="374" y="121" font-family="serif" font-size="21" fill="#283b4b">Rīga lasa.</text><g stroke="#9aa8a9" stroke-width="3"><path d="M375 138h105m-105 14h105m-105 14h85m-85 14h95"/></g><path d="M500 136h24m-8-7 8 7-8 7" stroke="#f7ce79" stroke-width="3" fill="none"/><g font-family="monospace" font-size="16" text-anchor="middle" fill="white"><rect x="530" y="100" width="87" height="36" rx="5" fill="#367c99"/><text x="573" y="123">Rīga</text><rect x="530" y="146" width="87" height="36" rx="5" fill="#367c99"/><text x="573" y="170">lasa.</text></g><g fill="#34576a" stroke="#8aacbd" stroke-width="1.3"><path d="M340 300v-42h26v-14h19v14h23v42z"/><path d="M413 300v-55h13v-17l10-22 10 22v17h14v55z"/><path d="M465 300v-33l26-23 26 23v33z"/><path d="M521 300v-59h14v-16l8-18 8 18v16h12v59z"/><path d="M568 300v-42h48v42z"/><path d="M330 300h295"/></g></svg>